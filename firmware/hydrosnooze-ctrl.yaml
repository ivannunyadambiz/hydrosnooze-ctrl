# Board: Seeed XIAO ESP32C3 (Seeed Studio)
# Definition: definitions/boards/seeed-xiao-esp32c3/manifest.yaml

# Author: Snowman
# Created: 2026-08-11

# If this software is useful to you, buy the author a beer.
# Otherwise, you're on your own. 🍺

esphome:
  name: hydrosnooze-ctrl
  friendly_name: Hydrosnooze-Ctrl
  
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Force the PID and its outputs to a known OFF state.
          id(thermal_pid).set_cool_output(nullptr);
          id(thermal_pid).set_heat_output(nullptr);
          auto call = id(thermal_pid).make_call();
          call.set_mode("OFF");
          call.perform();
  
          id(thermal_pid).reset_integral_term();
  
          id(heater_power).set_level(0.0f);
          id(cooler_power).set_level(0.0f);
  
          id(heater).turn_off();
          id(cooler).turn_off();
          id(pump).turn_off();
  
          id(controller_started) = true;

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret hydrosnooze_ctrl__encryption_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret hydrosnooze_ctrl__ap_ssid
    password: !secret hydrosnooze_ctrl__ap_password
captive_portal:

web_server:

i2c:
  sda: GPIO6
  scl: GPIO7
  scan: true

mcp23017:
  - id: io
    address: 0x20

climate:
  - platform: pid
    id: thermal_pid
    name: Thermal PID
    internal: true

    sensor: water_temperature

    default_target_temperature: 30°C

    heat_output: heater_power
    cool_output: cooler_power

    control_parameters:
      kp: 0.65
      ki: 0.0005
      kd: 0.0

      min_integral: 0.0
      max_integral: 0.50

      output_averaging_samples: 3
      derivative_averaging_samples: 3

    deadband_parameters:
      threshold_high: 0.1°C
      threshold_low: -0.1°C
      kp_multiplier: 0.05
      ki_multiplier: 0.05
      kd_multiplier: 0.0
      deadband_output_averaging_samples: 10

button:
  - platform: template
    name: PID Autotune
    entity_category: config
    on_press:
      - climate.control:
          id: thermal_pid
          mode: HEAT_COOL
  
      - climate.pid.autotune:
          id: thermal_pid
          noiseband: 0.1
          positive_output: 50%
          negative_output: -50%
          
  - platform: restart
    name: Restart Controller
    
  - platform: template
    name: Reset Safety Faults
    entity_category: config
    icon: "mdi:alert-remove"
    on_press:
      - if:
          condition:
            binary_sensor.is_off: float_switch
          then:
            - lambda: |-
                id(pump_error) = false;
                id(level_error) = false;
                id(pump_low_current_since) = 0;

    id: reset_safety_faults
text_sensor:
  - platform: version
    name: ESPHome Version

sensor:
  - platform: pid
    climate_id: thermal_pid
    id: pid_cooling_output
    name: PID Cooling Output
    type: COOL
    accuracy_decimals: 0
        
  - platform: pid
    climate_id: thermal_pid
    id: pid_heating_output
    name: PID Heating Output
    type: HEAT
    accuracy_decimals: 0
        
  - platform: template
    id: cooling_fan_speed_sensor
    name: Cooling Fan Request
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:fan"
    update_interval: 2s
    lambda: |-
      return id(cooling_fan_speed) * 100.0f;
      
  - platform: uptime
    name: Uptime

  - platform: adc
    pin: GPIO3
    id: pump_current_adc
    name: Pump Current ADC
    update_interval: 250ms
    attenuation: 0db
    accuracy_decimals: 3
    icon: "mdi:pump"

    on_value:
      then:
        - lambda: |-
            // Only monitor current while the pump is commanded ON.
            if (id(pump).state && !id(pump_error)) {
              if (x < 0.15f) {
                if (id(pump_low_current_since) == 0) {
                  id(pump_low_current_since) = millis();
                }
  
                // Low current continuously for 2 seconds
                if (millis() - id(pump_low_current_since) >= 2000) {
                  id(pump_error) = true;
                  id(pump_low_current_since) = 0;
  
                  id(heater_power).set_level(0.0f);
                  id(cooler_power).set_level(0.0f);
                  id(heater).turn_off();
                  id(cooler).turn_off();
                  id(pump).turn_off();
                }
              } else {
                // Current recovered, reset the timer
                id(pump_low_current_since) = 0;
              }
            } else {
              id(pump_low_current_since) = 0;
            }
            
    internal: true
  - platform: template
    id: pump_current
    name: Pump Current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 250ms
    lambda: |-
      return id(pump_current_adc).state;
    
  - platform: adc
    pin: GPIO4
    id: water_temp_adc
    name: Water Temperature ADC
    update_interval: 250ms
    attenuation: auto
    accuracy_decimals: 3
    icon: "mdi:coolant-temperature"
    internal: true

  - platform: template
    id: water_temperature
    name: Water Temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:coolant-temperature"
    update_interval: 250ms
    lambda: |-
      const float Vcc       = 3.282f;
      const float Rpullup   = 15040.0f;
      const float R0        = 48300.0f;
      const float T0        = 298.15f;
      const float Beta      = 4340.0f;

      const float V = id(water_temp_adc).state;

      if (V <= 0.0f || V >= Vcc) {
        return NAN;
      }

      const float Rntc = Rpullup * V / (Vcc - V);

      const float T = 1.0f /
        ((1.0f / T0) + (log(Rntc / R0) / Beta));

      return T - 273.15f;

  - platform: template
    id: temperature_error_sensor
    name: Temperature Deviation
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 1
    icon: "mdi:coolant-temperature"
    update_interval: 2s
    lambda: |-
      return id(water_temperature).state - id(temperature_setpoint).state;

  - platform: pulse_meter
    pin:
      number: GPIO20
      mode:
        input: true
        pullup: true
    name: Fan 1 RPM
    id: fan1_rpm
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    icon: "mdi:fan"
    filters:
      - multiply: 0.5
        
  - platform: pulse_meter
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
    name: Fan 2 RPM
    id: fan2_rpm
    unit_of_measurement: "RPM"
    accuracy_decimals: 0
    icon: "mdi:fan"
    filters:
      - multiply: 0.5

binary_sensor:  
  - platform: template
    id: pump_status
    name: Pump
    lambda: |-
      return id(pump).state;
    icon: "mdi:pump"

  - platform: template
    id: cooler_status
    name: Cooler
    lambda: |-
      return id(cooler).state;
    icon: "mdi:snowflake"

  - platform: template
    id: heater_status
    name: Heater
    lambda: |-
      return id(heater).state;
    icon: "mdi:fire"
      
  - platform: status
    name: Controller Online

  - platform: gpio
    id: float_switch
    name: Water Level Error
    pin:
      mcp23xxx: io
      number: 0
      mode:
        input: true
        pullup: false
      inverted: true
    icon: "mdi:exclamation-thick"

    on_state:
      then:
        - lambda: |-
            id(level_error) = id(float_switch).state;

            if (id(level_error)) {
              id(thermal_pid).reset_integral_term();
              id(heater_power).set_level(0.0f);
              id(cooler_power).set_level(0.0f);
              id(heater).turn_off();
              id(cooler).turn_off();
              id(pump).turn_off();
            }
    
  - platform: template
    id: pump_error_sensor
    name: Pump Error
    device_class: problem
    lambda: |-
      return id(pump_error);
    icon: "mdi:exclamation-thick"
    
output:
  - platform: slow_pwm
    id: cooler_power
    period: 5s
    restart_cycle_on_state_change: false

    turn_on_action:
      - switch.turn_on: cooler

    turn_off_action:
      - switch.turn_off: cooler
        
  - platform: slow_pwm
    id: heater_power
    period: 2s
    restart_cycle_on_state_change: false

    turn_on_action:
      - switch.turn_on: heater

    turn_off_action:
      - switch.turn_off: heater
        
  - platform: ledc
    id: fan_pwm_output
    pin:
      number: GPIO10
      inverted: true
    frequency: 25000 Hz

fan:
  - platform: speed
    name: Fan
    id: hsfan
    internal: true
    output: fan_pwm_output
    icon: "mdi:fan"

switch:
  - platform: gpio
    id: pump
    internal: true
    name: Pump
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: io
      number: 8
      mode:
        output: true
      inverted: false
    icon: "mdi:pump"
  
    on_turn_off:
      - lambda: |-
          id(thermal_pid).reset_integral_term();
          id(heater_power).set_level(0.0f);
          id(cooler_power).set_level(0.0f);
          id(cooling_fan_speed) = 0.0f;
          id(heater).turn_off();
          id(cooler).turn_off();

      - if:
          condition:
            lambda: |-
              return !id(thermal_shutdown_active);
          then:
            - select.set:
                id: thermal_mode
                option: "Off"
    
  - platform: gpio
    id: cooler
    internal: true
    name: Cooler
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: io
      number: 9
      mode:
        output: true
      inverted: false
    icon: "mdi:snowflake"

    on_turn_on:
      - if:
          condition:
            lambda: |-
              return id(pump_error) || id(float_switch).state;
          then:
            - switch.turn_off: cooler
          else:
            - switch.turn_off: heater
            - switch.turn_on: pump

            - if:
                condition:
                  lambda: |-
                    return id(thermal_mode).current_option() == "Cooling" && (!id(hsfan).state || id(hsfan).speed < 0.30f);
                then:
                  - fan.turn_on:
                      id: hsfan
                      speed: 30
    
  - platform: gpio
    id: heater
    internal: true
    name: Heater
    restore_mode: ALWAYS_OFF
    pin:
      mcp23xxx: io
      number: 10
      mode:
        output: true
      inverted: true
    icon: "mdi:fire"
  
    on_turn_on:
      - if:
          condition:
            lambda: |-
              return id(pump_error) || id(float_switch).state;
          then:
            - switch.turn_off: heater
          else:
            - switch.turn_off: cooler
            - switch.turn_on: pump

globals:
  - id: controller_started
    type: bool
    restore_value: no
    initial_value: "false"
    
  - id: temperature_error
    type: bool
    restore_value: no
    initial_value: "false"
    
  - id: thermal_shutdown_active
    type: bool
    restore_value: no
    initial_value: "false"
    
  - id: pump_error
    type: bool
    restore_value: no
    initial_value: "false"

  - id: level_error
    type: bool
    restore_value: no
    initial_value: "false"

  - id: pump_low_current_since
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: cooling_fan_speed
    type: float
    restore_value: no
    initial_value: "0.0"

script:
  - id: thermal_shutdown
    mode: restart
    then:
      - lambda: |-
          id(thermal_shutdown_active) = true;

      # thermal outputs Off
      - lambda: |-
          id(heater_power).set_level(0.0f);
          id(cooler_power).set_level(0.0f);
          id(cooling_fan_speed) = 0.0f;
          id(heater).turn_off();
          id(cooler).turn_off();

      - switch.turn_on: pump
      - fan.turn_on:
          id: hsfan
          speed: 100

      - delay: 120s

      - fan.turn_off: hsfan
      - switch.turn_off: pump

      - lambda: |-
          id(thermal_shutdown_active) = false;

number:
  - platform: template
    id: temperature_setpoint
    name: Temperature Setpoint
    min_value: 15
    max_value: 55
    step: 0.5
    initial_value: 30
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    mode: box

    on_value:
      - lambda: |-
          auto call = id(thermal_pid).make_call();
          call.set_target_temperature(x);
          call.perform();

select:
  - platform: template
    id: thermal_mode
    name: Thermal Mode
    options:
      - "Off"
      - "Heating"
      - "Cooling"
    initial_option: "Off"
    restore_value: false
    optimistic: true

    on_value:
      - lambda: |-
          const std::string mode = id(thermal_mode).current_option();
    
          if (mode == "Off") {
            id(heater_power).set_level(0.0f);
            id(cooler_power).set_level(0.0f);
            
            id(thermal_pid).set_heat_output(nullptr);
            id(thermal_pid).set_cool_output(nullptr);
            
            id(thermal_pid).reset_integral_term();

            auto call = id(thermal_pid).make_call();
            call.set_mode("OFF");
            call.perform();
            
            id(heater).turn_off();
            id(cooler).turn_off();
          
            // Never run the purge automatically during boot.
            if (!id(controller_started)) {
              return;
            }
          
            // Start the 2-minute Peltier cooldown/purge.
            id(thermal_shutdown).execute();
          
            return;
          }
    
          if (mode == "Heating") {
            id(thermal_pid).set_cool_output(nullptr);
            id(thermal_pid).set_heat_output(id(heater_power));
            
            auto call = id(thermal_pid).make_call();
            call.set_mode("HEAT");
            call.set_target_temperature(id(temperature_setpoint).state);
            call.perform();
    
            return;
          }
    
          if (mode == "Cooling") {
            id(thermal_pid).set_heat_output(nullptr);
            id(thermal_pid).set_cool_output(id(cooler_power));
            
            auto call = id(thermal_pid).make_call();
            call.set_mode("COOL");
            call.set_target_temperature(id(temperature_setpoint).state);
            call.perform();
    
            return;
          }

interval:
  - interval: 2s
    then:
      - lambda: |-
          const float temp = id(water_temperature).state;
          const float setpoint = id(temperature_setpoint).state;

          // ------------------------------------------------------------
          // HARD TEMPERATURE SAFETY LIMIT
          // ------------------------------------------------------------

          if (temp < 10.0f || temp > 60.0f) {

            id(temperature_error) = true;

            id(thermal_pid).reset_integral_term();

            id(heater_power).set_level(0.0f);
            id(cooler_power).set_level(0.0f);

            id(heater).turn_off();
            id(cooler).turn_off();
            id(pump).turn_off();

            id(hsfan).turn_off();
            id(cooling_fan_speed) = 0.0f;

            auto call = id(thermal_mode).make_call();
            call.set_option("Off");
            call.perform();

            return;
          }

          // ------------------------------------------------------------
          // INVALID TEMPERATURE
          // ------------------------------------------------------------

          if (isnan(temp) || isnan(setpoint)) {

            id(thermal_pid).reset_integral_term();

            id(heater_power).set_level(0.0f);
            id(cooler_power).set_level(0.0f);

            id(heater).turn_off();
            id(cooler).turn_off();

            id(hsfan).turn_off();
            id(cooling_fan_speed) = 0.0f;

            return;
          }

          // ------------------------------------------------------------
          // SAFETY FAULTS OVERRIDE EVERYTHING
          // ------------------------------------------------------------

          if (id(pump_error) || id(float_switch).state) {

            id(thermal_pid).reset_integral_term();

            id(heater_power).set_level(0.0f);
            id(cooler_power).set_level(0.0f);

            id(heater).turn_off();
            id(cooler).turn_off();
            id(pump).turn_off();

            id(hsfan).turn_off();
            id(cooling_fan_speed) = 0.0f;

            return;
          }

          const std::string mode =
              id(thermal_mode).current_option();

          // ------------------------------------------------------------
          // THERMAL SHUTDOWN / PELTIER PURGE
          // Let the purge script have complete control of the fan/pump.
          // ------------------------------------------------------------
          
          if (id(thermal_shutdown_active)) {
            return;
          }

          // ------------------------------------------------------------
          // COOLING FAN
          // ------------------------------------------------------------
          
          if (mode == "Cooling") {
          
            // PID sensor reports cooling output as 0 ... 100 (%).
            // Convert it to the 0.0 ... 1.0 range used by the fan logic.
            const float cooling_output =
                id(pid_cooling_output).state / 100.0f;
          
            if (isnan(cooling_output) || cooling_output <= 0.001f) {
          
              // Cooling mode but PID requests no cooling:
              // keep fan at minimum speed.
              const float requested_fan = 0.30f;
          
              if (fabsf(requested_fan - id(cooling_fan_speed)) >= 0.05f) {
          
                auto call = id(hsfan).make_call();
                call.set_state(true);
                call.set_speed(30);
                call.perform();
          
                id(cooling_fan_speed) = requested_fan;
              }
          
            } else {
          
              // Minimum 30% fan speed while cooling is active.
              const float requested_fan =
                  (cooling_output > 0.30f)
                    ? cooling_output
                    : 0.30f;
          
              if (fabsf(requested_fan - id(cooling_fan_speed)) >= 0.05f) {
          
                auto call = id(hsfan).make_call();
                call.set_state(true);
                call.set_speed(
                    (int) roundf(requested_fan * 100.0f)
                );
                call.perform();
          
                id(cooling_fan_speed) = requested_fan;
              }
            }
          
          } else {
          
            // Heating / Off -> fan at minimum speed.
            const float requested_fan = 0.30f;
          
            if (fabsf(requested_fan - id(cooling_fan_speed)) >= 0.05f) {
          
              auto call = id(hsfan).make_call();
              call.set_state(true);
              call.set_speed(30);
              call.perform();
          
              id(cooling_fan_speed) = requested_fan;
            }
          }